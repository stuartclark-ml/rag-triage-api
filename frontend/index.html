<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>H&C Incident Triage — rag-triage-api</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --ink:        #0f1419;
  --ink-2:      #2c3340;
  --ink-3:      #545d6b;
  --ink-4:      #8a9099;
  --ink-5:      #bdc2c9;
  --bg:         #f2f3f5;
  --surface:    #ffffff;
  --line:       #e0e2e6;

  /* ISO 7010 safety palette */
  --blue:       #005387;
  --blue-2:     #0071b8;
  --blue-tint:  #e3eff8;
  --green:      #1b5e20;
  --green-2:    #2e7d32;
  --green-tint: #e8f5e9;
  --amber:      #b35c00;
  --amber-2:    #e65100;
  --amber-tint: #fff3e0;
  --red:        #b71c1c;
  --red-2:      #c62828;
  --red-tint:   #ffebee;

  --font-sans: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-disp: 'Syne', sans-serif;
  --r: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(15,20,25,0.75);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn 0.2s ease;
}
.modal {
  background: var(--surface);
  max-width: 560px; width: 100%;
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.3);
  animation: slideUp 0.25s ease;
}
.modal-head {
  background: rgb(253, 244, 78);
  padding: 20px 28px;
  display: flex; align-items: center; gap: 14px;
}
.modal-head-icon {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid rgb(0, 0, 0);
  display: grid; place-items: center;
  font-family: var(--font-disp); font-size: 18px; font-weight: 800;
  color: rgb(0, 0, 0); flex-shrink: 0;
}
.modal-head-text { color: rgb(1, 1, 1); }
.modal-head-title {
  font-family: var(--font-disp); font-size: 24px; font-weight: 700;
  letter-spacing: 0.01em;
}
.modal-head-sub { font-size: 18px; opacity: 0.75; margin-top: 2px; }
.modal-body { padding: 28px; }
.modal-body p {
  font-size: 13px; color: var(--ink-2); margin-bottom: 16px; line-height: 1.65;
}
.modal-items { list-style: none; margin-bottom: 24px; }
.modal-items li {
  display: flex; align-items: flex-start; gap: 12px;
  font-size: 13px; color: var(--ink-2); line-height: 1.55;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.modal-items li:last-child { border-bottom: none; }
.modal-items li::before {
  content: "▪";
  color: var(--blue); font-size: 10px; margin-top: 4px; flex-shrink: 0;
}
.modal-confirm {
  width: 100%;
  background: var(--blue); color: white;
  border: none; border-radius: var(--r);
  padding: 13px 24px;
  font-family: var(--font-disp); font-size: 14px; font-weight: 700;
  letter-spacing: 0.03em; cursor: pointer;
  transition: background 0.15s;
}
.modal-confirm:hover { background: var(--blue-2); }

/* ── HEADER ── */
.header {
  background: var(--ink);
  padding: 0 40px;
  display: flex; align-items: stretch;
  gap: 0;
  position: sticky; top: 0; z-index: 50;
}
.header-brand {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0; border-right: 1px solid rgba(255,255,255,0.08);
  padding-right: 24px; margin-right: 24px;
}
.header-mark {
  width: 32px; height: 32px;
  background: var(--blue);
  border-radius: 2px;
  display: grid; place-items: center;
  font-family: var(--font-disp); font-size: 13px; font-weight: 800;
  color: white; letter-spacing: -0.02em;
}
.header-name {
  font-family: var(--font-disp); font-size: 14px; font-weight: 700;
  color: white; letter-spacing: 0.01em;
}
.header-sub { font-size: 11px; color: rgba(255,255,255,0.4); font-family: var(--font-mono); margin-top: 1px; }
.header-meta {
  display: flex; align-items: center; gap: 0; flex: 1;
}
.header-field {
  display: flex; flex-direction: column;
  padding: 14px 20px; border-right: 1px solid rgba(255,255,255,0.06);
}
.header-field-label { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-mono); }
.header-field-value { font-size: 12px; color: rgba(255,255,255,0.75); font-family: var(--font-mono); margin-top: 2px; }
.header-status {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  padding: 14px 0 14px 20px;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-2); }
.status-text { font-size: 11px; color: rgba(255,255,255,0.4); font-family: var(--font-mono); }

/* ── DOMAIN BANNER ── */
.domain-banner {
  background: var(--blue);
  padding: 9px 40px;
  display: flex; align-items: center; gap: 16px;
  font-family: var(--font-mono); font-size: 11.5px; color: white;
  letter-spacing: 0.02em;
}
.domain-tag {
  background: rgba(255,255,255,0.18);
  padding: 2px 8px; border-radius: 2px;
  font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.06em; font-size: 10px; flex-shrink: 0;
}
.domain-text { opacity: 0.88; }
.domain-sep { opacity: 0.3; }

/* ── LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 0;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0;
}

/* ── NAV RAIL ── */
.nav {
  position: sticky; top: 88px;
  height: calc(100vh - 88px);
  overflow-y: auto;
  padding: 28px 0;
  border-right: 1px solid var(--line);
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 20px;
  font-size: 12.5px; color: var(--ink-3);
  text-decoration: none; cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s;
}
.nav-item:hover { color: var(--ink); background: rgba(0,83,135,0.04); border-left-color: var(--blue); }
.nav-item.active { color: var(--blue); background: var(--blue-tint); border-left-color: var(--blue); font-weight: 500; }
.nav-code {
  font-family: var(--font-mono); font-size: 10px;
  background: var(--bg); padding: 1px 5px; border-radius: 2px;
  color: var(--ink-4); border: 1px solid var(--line);
}
.nav-item.active .nav-code { background: var(--blue-tint); border-color: var(--blue); color: var(--blue); }
.nav-divider { height: 1px; background: var(--line); margin: 12px 20px; }
.nav-section-label {
  padding: 6px 20px 4px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-5); font-family: var(--font-mono);
}

/* ── CONTENT ── */
.content { padding: 32px 40px; min-height: 100vh; }

/* ── NARRATIVE ── */
.narrative-block {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 20px 24px;
  margin-bottom: 32px;
}
.narrative-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-4); font-family: var(--font-mono); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.narrative-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.narrative-text { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }

/* ── SECTION ── */
.section { margin-bottom: 36px; }
.section-header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 2px solid var(--ink);
}
.section-code {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  background: var(--ink); color: white;
  padding: 3px 8px; border-radius: 2px;
  letter-spacing: 0.04em;
}
.section-title {
  font-family: var(--font-disp); font-size: 18px; font-weight: 700;
  color: var(--ink); letter-spacing: -0.01em;
}
.section-desc { font-size: 12px; color: var(--ink-4); margin-top: 4px; line-height: 1.5; }

/* ── CARDS ── */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 20px 24px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-3); font-family: var(--font-mono); font-weight: 500;
  margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.card-sub { font-size: 10.5px; color: var(--ink-5); font-weight: 400; }

/* ── SEVERITY PREDICTION ── */
.sev-hero {
  display: flex; align-items: stretch; gap: 0;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden; margin-bottom: 12px;
}
.sev-hero-class {
  padding: 24px 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 140px;
}
.sev-hero-label {
  font-family: var(--font-disp); font-size: 28px; font-weight: 800;
  letter-spacing: -0.02em; line-height: 1;
}
.sev-hero-band {
  font-family: var(--font-mono); font-size: 11px;
  margin-top: 5px; opacity: 0.65;
}
.sev-hero-divider { width: 1px; background: var(--line); }
.sev-hero-detail {
  flex: 1; padding: 20px 24px;
  display: flex; flex-direction: column; justify-content: center; gap: 8px;
}
.sev-hero-conf {
  font-family: var(--font-mono); font-size: 22px; font-weight: 500;
  color: var(--ink);
}
.sev-hero-conf-label { font-size: 11px; color: var(--ink-4); }
.sev-hero-flags { display: flex; flex-direction: column; gap: 6px; }
.sev-hero-model {
  font-size: 11.5px; color: var(--ink-4); font-family: var(--font-mono);
}

.prob-list { display: flex; flex-direction: column; gap: 8px; }
.prob-row {
  display: grid; grid-template-columns: 160px 1fr 52px;
  align-items: center; gap: 12px;
}
.prob-name { font-size: 13px; color: var(--ink-2); }
.prob-name.predicted { font-weight: 600; color: var(--ink); }
.prob-track {
  height: 8px; background: var(--bg); border-radius: 2px; overflow: hidden;
}
.prob-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.prob-pct {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--ink-3); text-align: right;
}
.prob-pct.predicted { font-weight: 500; color: var(--ink); }

/* ── ALERTS ── */
.alert {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 16px; border-radius: var(--r);
  border: 1px solid; margin-bottom: 10px;
}
.alert-danger { background: var(--red-tint); border-color: var(--red); }
.alert-warn   { background: var(--amber-tint); border-color: var(--amber); }
.alert-info   { background: var(--blue-tint); border-color: var(--blue); }
.alert-icon {
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
.alert-danger .alert-icon { background: var(--red); color: white; }
.alert-warn   .alert-icon { background: var(--amber); color: white; }
.alert-info   .alert-icon { background: var(--blue); color: white; }
.alert-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.alert-danger .alert-title { color: var(--red); }
.alert-warn   .alert-title { color: var(--amber-2); }
.alert-info   .alert-title { color: var(--blue); }
.alert-body { font-size: 12.5px; color: var(--ink-3); line-height: 1.55; }

/* ── RIDDOR ── */
.riddor-cat {
  border: 1px solid var(--line); border-radius: var(--r);
  margin-bottom: 10px; overflow: hidden;
}
.riddor-cat-head {
  padding: 14px 18px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
}
.riddor-cat-name { font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.4; }
.riddor-cat-desc { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; line-height: 1.55; }
.riddor-deadline {
  flex-shrink: 0; padding: 5px 10px;
  border-radius: var(--r); font-family: var(--font-mono); font-size: 11px;
  font-weight: 500; white-space: normal; max-width: 200px; line-height: 1.45;
}
.deadline-immediate { background: var(--red-tint); color: var(--red); border: 1px solid var(--red); }
.deadline-15day     { background: var(--amber-tint); color: var(--amber-2); border: 1px solid var(--amber); }
.deadline-record    { background: var(--green-tint); color: var(--green); border: 1px solid var(--green); }
.riddor-cat-info {
  background: var(--bg); border-top: 1px solid var(--line);
  padding: 12px 18px;
}
.riddor-info-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-4); font-family: var(--font-mono); margin-bottom: 7px;
}
.riddor-info-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.riddor-info-list li {
  font-size: 12.5px; color: var(--ink-3); padding-left: 14px; position: relative; line-height: 1.5;
}
.riddor-info-list li::before {
  content: "→"; position: absolute; left: 0;
  color: var(--amber); font-size: 11px; top: 2px;
}

.follow-up-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.follow-up-list li {
  font-size: 13px; color: var(--ink-2); line-height: 1.55;
  padding: 10px 14px; background: var(--bg); border-radius: var(--r);
  border-left: 3px solid var(--blue); position: relative;
}
.follow-up-num {
  font-family: var(--font-mono); font-size: 10px; color: var(--blue);
  margin-bottom: 2px; font-weight: 500;
}

/* ── DISCLAIMER BOX ── */
.disclaimer {
  background: var(--blue-tint); border: 1px solid var(--blue);
  border-radius: var(--r); padding: 12px 16px;
  font-size: 12px; color: var(--blue); line-height: 1.55;
  display: flex; gap: 10px; align-items: flex-start;
}
.disclaimer strong { font-weight: 600; }

/* ── CAUSAL ANALYSIS ── */
.cause-block {
  border: 1px solid var(--line); border-radius: var(--r);
  margin-bottom: 10px; overflow: hidden;
}
.cause-head {
  background: var(--amber-tint); border-bottom: 1px solid var(--line);
  padding: 12px 18px; display: flex; align-items: center; gap: 12px;
}
.cause-type-badge {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  background: var(--amber); color: white;
  padding: 2px 8px; border-radius: 2px; text-transform: uppercase;
  letter-spacing: 0.05em;
}
.cause-desc-text { font-size: 13px; color: var(--ink-2); line-height: 1.5; flex: 1; }
.cause-ref {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4);
  flex-shrink: 0;
}
.cause-mitigations { padding: 14px 18px; }
.cause-mit-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-4); font-family: var(--font-mono); margin-bottom: 8px;
}
.cause-mit-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.cause-mit-list li {
  font-size: 12.5px; color: var(--ink-3); line-height: 1.5;
  padding-left: 14px; position: relative;
}
.cause-mit-list li::before {
  content: "–"; position: absolute; left: 0; color: var(--ink-4);
}

/* ── PATTERNS ── */
.incident-row {
  display: grid; grid-template-columns: 1fr 90px;
  gap: 16px; align-items: start;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.incident-row:last-child { border-bottom: none; }
.incident-excerpt { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.sev-badge {
  display: inline-block; padding: 3px 8px; border-radius: 2px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  text-align: center;
}
.sev-0 { background: var(--green-tint); color: var(--green); border: 1px solid var(--green-tint); }
.sev-1 { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
.sev-2 { background: var(--amber-tint); color: var(--amber); border: 1px solid #ffe0b2; }
.sev-3 { background: #fbe9e7; color: var(--amber-2); border: 1px solid #ffccbc; }
.sev-4 { background: var(--red-tint); color: var(--red); border: 1px solid #ffcdd2; }

.dist-chart { display: flex; flex-direction: column; gap: 10px; }
.dist-row { display: grid; grid-template-columns: 140px 1fr 60px; align-items: center; gap: 12px; }
.dist-label { font-size: 12.5px; color: var(--ink-2); }
.dist-track { height: 14px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.dist-fill { height: 100%; border-radius: 2px; }
.dist-pct { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); text-align: right; }

/* ── FOOTER ── */
.footer {
  background: var(--ink); color: rgba(255,255,255,0.4);
  padding: 24px 40px; font-family: var(--font-mono); font-size: 11px;
  display: flex; align-items: center; justify-content: space-between;
  line-height: 1.6; margin-top: 40px;
}

/* ── ANIMATIONS ── */
@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const SEV_COLORS = ["var(--green)","var(--green-2)","var(--amber)","var(--amber-2)","var(--red)"];
const SEV_TINTS  = ["var(--green-tint)","#e8f5e9","var(--amber-tint)","#fbe9e7","var(--red-tint)"];

const SEVERITY_CLASSES = [
  { id: 0, name: "None",     band: "0 days" },
  { id: 1, name: "Minor",    band: "1–2 days" },
  { id: 2, name: "Moderate", band: "3–7 days" },
  { id: 3, name: "Severe",   band: "8–28 days" },
  { id: 4, name: "Major",    band: "29+ days" },
];

const PIPELINE_STEPS = [
  "Running severity prediction…",
  "Extracting RIDDOR facts…",
  "Analysing contributing causes…",
  "Searching OSHA H&C patterns…",
];

const API_URL = "http://localhost:8000";

function pct(v) { return (v * 100).toFixed(1) + "%"; }
function sevColor(id) { return SEV_COLORS[id] || SEV_COLORS[0]; }
function sevTint(id)  { return SEV_TINTS[id]  || SEV_TINTS[0];  }

function deadlineClass(dl) {
  if (!dl) return "";
  const d = dl.toLowerCase();
  if (d.includes("immediately") || d.includes("without delay")) return "deadline-immediate";
  if (d.includes("15 days") || d.includes("days")) return "deadline-15day";
  return "deadline-record";
}

function genRef() {
  const now = new Date();
  const d = now.toISOString().slice(0,10).replace(/-/g,"");
  const n = String(Math.floor(Math.random()*900)+100);
  return `INC-${d}-${n}`;
}

function Modal({ onConfirm }) {
  return (
    <div className="modal-overlay">
      <div className="modal">
        <div className="modal-head">
          <div className="modal-head-icon">i</div>
          <div className="modal-head-text">
            <div className="modal-head-title">Important — Before You Continue</div>
            <div className="modal-head-sub">Please read carefully before using this tool</div>
          </div>
        </div>
        <div className="modal-body">
          <p>This is a <strong>portfolio demonstration project</strong>. It is not a live regulatory or clinical system. Review the following constraints before proceeding.</p>
          <ul className="modal-items">
            <li>No incident data is saved, stored, or transmitted</li>
            <li>All outputs are decision-support tools only — not compliance determinations</li>
            <li>This system was trained exclusively on OSHA Health and Social Care care home data and has not been validated outside this domain</li>
            <li>The severity model has a known blind spot for needlestick injuries — a mandatory flag is applied but human review is essential</li>
            <li>RIDDOR outputs are conditional advisories only — a competent person must make all final regulatory determinations</li>
            <li>Causal analysis surfaces directions for investigation only — not root cause conclusions</li>
            <li>All regulatory and clinical judgements must be made by a suitably qualified person</li>
          </ul>
          <button style={{ background: "var(--green)", color: "white" }} className="modal-confirm" onClick={onConfirm}>I Understand — Continue</button>
        </div>
      </div>
    </div>
  );
}

function InputForm({ onSubmit }) {
  const [narrative, setNarrative] = React.useState("");
  const [confirmed, setConfirmed] = React.useState(false);
  const [error, setError] = React.useState("");

  const charCount = narrative.trim().length;
  const ready = charCount >= 50 && confirmed;

  function handleSubmit() {
    if (charCount < 50) { setError("Narrative must be at least 50 characters."); return; }
    if (!confirmed) { setError("You must confirm this incident is from a health and social care care home setting."); return; }
    setError("");
    onSubmit(narrative);
  }

  return (
    <div style={{ maxWidth: 760, margin: "48px auto", padding: "0 24px" }}>
      <div className="section-header" style={{ marginBottom: 24 }}>
        <span className="section-code">INPUT</span>
        <div>
          <div className="section-title">Incident narrative</div>
          <div className="section-desc">Health and social care care home settings only. Minimum 50 characters.</div>
        </div>
      </div>
      <div className="card">
        <textarea
          value={narrative}
          onChange={e => setNarrative(e.target.value)}
          placeholder="Enter the full incident narrative here…"
          style={{
            width: "100%", minHeight: 200,
            font: "14px/1.65 var(--font-sans)",
            color: "var(--ink)", background: "var(--bg)",
            border: "1px solid var(--line)", borderRadius: "var(--r)",
            padding: "14px 16px", resize: "vertical", outline: "none",
          }}
        />
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 6 }}>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: charCount >= 50 ? "var(--green)" : "var(--ink-4)" }}>
            {charCount} characters {charCount < 50 ? `(${50 - charCount} more required)` : "✓"}
          </span>
        </div>
        <div style={{ marginTop: 16, padding: "12px 16px", background: "var(--blue-tint)", borderRadius: "var(--r)", border: "1px solid var(--blue)", display: "flex", alignItems: "flex-start", gap: 12 }}>
          <input
            type="checkbox"
            id="domain-confirm"
            checked={confirmed}
            onChange={e => setConfirmed(e.target.checked)}
            style={{ marginTop: 3, accentColor: "var(--blue)", flexShrink: 0 }}
          />
          <label htmlFor="domain-confirm" style={{ fontSize: 13, color: "var(--blue)", lineHeight: 1.55, cursor: "pointer" }}>
            I confirm this incident is from a <strong>health and social care care home setting</strong>. This system has not been validated outside this domain.
          </label>
        </div>
        {error && (
          <div className="alert alert-warn" style={{ marginTop: 12 }}>
            <div className="alert-icon">!</div>
            <div><div className="alert-body">{error}</div></div>
          </div>
        )}
        <button
          onClick={handleSubmit}
          disabled={!ready}
          style={{
            marginTop: 16, width: "100%",
            background: ready ? "var(--blue)" : "var(--line)",
            color: ready ? "white" : "var(--ink-4)",
            border: "none", borderRadius: "var(--r)",
            padding: "13px 24px",
            fontFamily: "var(--font-disp)", fontSize: 14, fontWeight: 700,
            letterSpacing: "0.03em", cursor: ready ? "pointer" : "not-allowed",
            transition: "background 0.15s",
          }}
        >
          Run Triage Pipeline →
        </button>
      </div>
    </div>
  );
}

function LoadingView() {
  const [stepIdx, setStepIdx] = React.useState(0);

  React.useEffect(() => {
    const id = setInterval(() => {
      setStepIdx(i => Math.min(i + 1, PIPELINE_STEPS.length - 1));
    }, 12000);
    return () => clearInterval(id);
  }, []);

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "60vh", gap: 24 }}>
      <div style={{
        width: 48, height: 48, borderRadius: "50%",
        border: "3px solid var(--line)",
        borderTopColor: "var(--blue)",
        animation: "spin 0.9s linear infinite",
      }} />
      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "var(--font-disp)", fontSize: 18, fontWeight: 700, color: "var(--ink)", marginBottom: 8 }}>
          {PIPELINE_STEPS[stepIdx]}
        </div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-4)" }}>
          This typically takes 30–60 seconds
        </div>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        {PIPELINE_STEPS.map((_, i) => (
          <div key={i} style={{
            width: 8, height: 8, borderRadius: "50%",
            background: i <= stepIdx ? "var(--blue)" : "var(--line)",
            transition: "background 0.3s",
          }} />
        ))}
      </div>
    </div>
  );
}

function Section({ id, code, title, desc, children }) {
  return (
    <div className="section" id={id}>
      <div className="section-header">
        <span className="section-code">{code}</span>
        <div>
          <div className="section-title">{title}</div>
          {desc && <div className="section-desc">{desc}</div>}
        </div>
      </div>
      {children}
    </div>
  );
}

function T1({ data }) {
  const t = data.severity_prediction;
  const pred = SEVERITY_CLASSES[t.predicted_class];
  const probEntries = SEVERITY_CLASSES.map((sc) => {
    const matchKey = Object.keys(t.probabilities).find(k => k.toLowerCase().startsWith(sc.name.toLowerCase())) || "";
    const val = t.probabilities[matchKey] ?? 0;
    return { sc, val };
  }).reverse();

  return (
    <Section id="t1" code="T1" title="Severity prediction"
      desc="ML model prediction using stuSterfc/ohs-severity-classifier (DistilBERT). Trained on OSHA H&C sector data. Confidence reflects probability mass on top class.">
      <div className="sev-hero">
        <div className="sev-hero-class" style={{ background: sevTint(t.predicted_class), borderRight: `3px solid ${sevColor(t.predicted_class)}` }}>
          <div className="sev-hero-label" style={{ color: sevColor(t.predicted_class) }}>{pred.name}</div>
          <div className="sev-hero-band" style={{ color: sevColor(t.predicted_class) }}>{pred.band}</div>
        </div>
        <div className="sev-hero-detail">
          <div>
            <div className="sev-hero-conf-label">Model confidence</div>
            <div className="sev-hero-conf">{pct(t.confidence)}</div>
          </div>
          <div className="sev-hero-model">stuSterfc/ohs-severity-classifier · DistilBERT</div>
        </div>
        <div style={{ padding: "20px 24px", borderLeft: "1px solid var(--line)", display: "flex", flexDirection: "column", gap: "8px", justifyContent: "center", minWidth: 200 }}>
          <div style={{ fontSize: 11, color: "var(--ink-4)", fontFamily: "var(--font-mono)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Advisory flags</div>
          <div style={{ fontSize: 12.5, color: t.needlestick_flag ? "var(--red)" : "var(--ink-5)" }}>
            {t.needlestick_flag ? "⚠ Needlestick detected" : "✓ No needlestick flag"}
          </div>
          <div style={{ fontSize: 12.5, color: t.middle_severity_flag ? "var(--amber-2)" : "var(--ink-5)" }}>
            {t.middle_severity_flag ? "⚠ Boundary class — review" : "✓ No boundary flag"}
          </div>
        </div>
      </div>
      {t.needlestick_flag && (
        <div className="alert alert-danger">
          <div className="alert-icon">!</div>
          <div>
            <div className="alert-title">Needlestick / sharps exposure detected</div>
            <p className="alert-body">Trigger the immediate sharps-injury protocol:CAUTION: CAUTION: The severity model was trained on data where 99% of needlestick 
injuries were recorded as zero lost time. The predicted severity class is 
unreliable for this injury type and must not be used. Clinical risk — 
including bloodborne virus exposure — requires immediate occupational health 
assessment regardless of model output..</p>
          </div>
        </div>
      )}
      {t.middle_severity_flag && (
        <div className="alert alert-warn">
          <div className="alert-icon">~</div>
          <div>
            <div className="alert-title">Boundary class — human review recommended</div>
            <p className="alert-body">The predicted class falls at a boundary where misclassification has reporting consequences. A senior reviewer should confirm the lost-time band before any external notification.</p>
          </div>
        </div>
      )}
      <div className="card">
        <div className="card-title">
          Class probability distribution
          <span className="card-sub">5-class softmax output</span>
        </div>
        <div className="prob-list">
          {probEntries.map(({ sc, val }) => {
            const isPred = sc.id === t.predicted_class;
            return (
              <div key={sc.id} className="prob-row">
                <div className={`prob-name ${isPred ? "predicted" : ""}`}>{sc.name} <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-5)" }}>({sc.band})</span></div>
                <div className="prob-track">
                  <div className="prob-fill" style={{ width: pct(val), background: isPred ? sevColor(sc.id) : sevTint(sc.id), border: isPred ? "none" : `1px solid ${sevColor(sc.id)}` }}></div>
                </div>
                <div className={`prob-pct ${isPred ? "predicted" : ""}`}>{pct(val)}</div>
              </div>
            );
          })}
        </div>
      </div>
    </Section>
  );
}

function T2({ data }) {
  const t = data.riddor_advisory;
  return (
    <Section id="t2" code="T2" title="RIDDOR advisory"
      desc="Conditional advisory only — not a determination. Based on RIDDOR 2013 and facts extracted from the narrative. A competent person must make the final determination when full information is available.">
      {t.potentially_applicable.map((cat, i) => (
        <div key={i} className="riddor-cat">
          <div className="riddor-cat-head">
            <div style={{ flex: 1 }}>
              <div className="riddor-cat-name">{cat.category}</div>
              <div className="riddor-cat-desc">{cat.description}</div>
            </div>
            <div className={`riddor-deadline ${deadlineClass(cat.reporting_deadline)}`}>
              {cat.reporting_deadline}
            </div>
          </div>
          {cat.information_needed.length > 0 && (
            <div className="riddor-cat-info">
              <div className="riddor-info-label">Information still required</div>
              <ul className="riddor-info-list">
                {cat.information_needed.map((item, j) => <li key={j}>{item}</li>)}
              </ul>
            </div>
          )}
        </div>
      ))}
      <div className="card" style={{ marginTop: 16 }}>
        <div className="card-title">Follow-up questions to pursue</div>
        <ul className="follow-up-list">
          {t.follow_up_questions.map((q, i) => (
            <li key={i}>
              <div className="follow-up-num">Q{i + 1}</div>
              {q}
            </li>
          ))}
        </ul>
      </div>
      <div className="disclaimer">
        <span style={{ fontWeight: 700, flexShrink: 0 }}>ⓘ</span>
        <span><strong>Mandatory:</strong> {t.disclaimer}</span>
      </div>
    </Section>
  );
}

function T3({ data }) {
  const t = data.causal_analysis;
  const seenMitigations = new Set();

  return (
    <Section id="t3" code="T3" title="Causal analysis"
      desc="Contributing causes identified via 4Ps extraction. Each cause searched independently against HSG220 (Health and safety in care homes). Mitigation actions are directions for investigation only.">

      {t.identified_causes.map((cause, i) => {
        const uniqueMitigations = cause.mitigation_actions.filter(a => {
          const normalised = a.trim().toLowerCase();
          if (seenMitigations.has(normalised)) return false;
          seenMitigations.add(normalised);
          return true;
        });

        return (
          <div key={i} className="cause-block">
            <div className="cause-head">
              <span className="cause-type-badge">{cause.cause_type}</span>
              <span className="cause-desc-text">{cause.description}</span>
              <span className="cause-ref">{cause.hsg220_section}</span>
            </div>
            <div className="cause-mitigations">
              <div className="cause-mit-label">Possible mitigation actions to investigate</div>
              {uniqueMitigations.length > 0 ? (
                <ul className="cause-mit-list">
                  {uniqueMitigations.map((a, j) => <li key={j}>{a}</li>)}
                </ul>
              ) : (
                <p style={{ fontSize: 12.5, color: "var(--ink-4)", fontStyle: "italic", lineHeight: 1.5 }}>
                  All mitigation actions for this cause are addressed in the blocks above.
                </p>
              )}
            </div>
          </div>
        );
      })}

      <div className="disclaimer">
        <span style={{ fontWeight: 700, flexShrink: 0 }}>ⓘ</span>
        <span><strong>Mandatory:</strong> {t.disclaimer}</span>
      </div>
    </Section>
  );
}

function T4({ data }) {
  const t = data.pattern_analysis;
  const sevName = (id) => SEVERITY_CLASSES[id]?.name || "Unknown";
  const mechUnknown = t.injury_mechanism && t.injury_mechanism.toLowerCase().startsWith("not extractable");
  const total = Object.values(t.severity_distribution).reduce((s, v) => s + v, 0);

  return (
    <Section id="t4" code="T4" title="Population-level patterns"
      desc="Semantic similarity search against 181,374 OSHA H&C sector records. H&C sector subset only — not the full OSHA dataset. No time-based analysis — dataset contains no timestamp at record level.">
      <div className="card">
        <div className="card-title">
          Most similar incidents
          <span className="card-sub">k-NN · MiniLM-L6-v2 embedding · top 10</span>
        </div>
        {t.similar_incidents.map((s, i) => (
          <div key={i} className="incident-row">
            <div className="incident-excerpt">{s.narrative_excerpt}</div>
            <div style={{ textAlign: "right" }}>
              <span className={`sev-badge sev-${s.severity_outcome}`}>{sevName(s.severity_outcome)}</span>
            </div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-title">
          Cohort severity distribution
          <span className="card-sub">similar incidents by outcome — static population counts</span>
        </div>
        <div className="dist-chart">
          {SEVERITY_CLASSES.map((sc) => {
            const count = t.severity_distribution[String(sc.id)] || 0;
            const pctVal = total > 0 ? (count / total) * 100 : 0;
            return (
              <div key={sc.id} className="dist-row">
                <div className="dist-label">{sc.name} <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-5)" }}>({sc.band})</span></div>
                <div className="dist-track">
                  <div className="dist-fill" style={{ width: `${pctVal}%`, background: sevColor(sc.id) }}></div>
                </div>
                <div className="dist-pct">{pctVal.toFixed(0)}%</div>
              </div>
            );
          })}
        </div>
        {mechUnknown && (
          <p style={{ marginTop: 14, fontSize: 11.5, color: "var(--ink-4)", fontStyle: "italic", lineHeight: 1.5 }}>{t.injury_mechanism}</p>
        )}
      </div>
    </Section>
  );
}

function ResultsView({ data, narrative, onReset }) {
  const navItems = [
    { id: "narrative", code: "—", label: "Narrative" },
    { id: "t1", code: "T1", label: "Severity prediction" },
    { id: "t2", code: "T2", label: "RIDDOR advisory" },
    { id: "t3", code: "T3", label: "Causal analysis" },
    { id: "t4", code: "T4", label: "Pattern analysis" },
  ];
  const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });

  return (
    <div className="layout">
      <nav className="nav">
        <div className="nav-section-label">Report sections</div>
        {navItems.map((item) => (
          <div key={item.id} className="nav-item" onClick={() => scrollTo(item.id)}>
            <span className="nav-code">{item.code}</span>
            {item.label}
          </div>
        ))}
        <div className="nav-divider"/>
        <div className="nav-section-label">Actions</div>
        <div className="nav-item" onClick={onReset} style={{ color: "var(--blue)", cursor: "pointer" }}>
          <span className="nav-code">↩</span>
          New triage
        </div>
      </nav>
      <main className="content">
        <div id="narrative" className="narrative-block">
          <div className="narrative-label">Incident narrative</div>
          <div className="narrative-text">{narrative}</div>
        </div>
        <T1 data={data} />
        <T2 data={data} />
        <T3 data={data} />
        <T4 data={data} />
      </main>
    </div>
  );
}

function App() {
  const [modalConfirmed, setModalConfirmed] = React.useState(false);
  const [view, setView] = React.useState("input");
  const [apiData, setApiData] = React.useState(null);
  const [narrative, setNarrative] = React.useState("");
  const [meta, setMeta] = React.useState(null);
  const [apiError, setApiError] = React.useState("");

  React.useEffect(() => {
    document.body.style.overflow = modalConfirmed ? "" : "hidden";
    return () => { document.body.style.overflow = ""; };
  }, [modalConfirmed]);

  async function handleSubmit(submittedNarrative) {
    setNarrative(submittedNarrative);
    setMeta({
      incidentRef: genRef(),
      analyst: "S. Clark",
      submittedAt: new Date().toISOString(),
      pipelineVersion: "rag-triage-api v0.1.0",
      modelStack: "stuSterfc/ohs-severity-classifier · map_riddor · analyse_causes · find_patterns",
    });
    setView("loading");
    setApiError("");

    try {
      const res = await fetch(`${API_URL}/triage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ narrative: submittedNarrative, confirmed_hc_domain: true }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      setApiData(data);
      setView("results");
    } catch (e) {
      setApiError(e.message || "Unknown error");
      setView("error");
    }
  }

  function handleReset() {
    setView("input");
    setApiData(null);
    setNarrative("");
    setApiError("");
  }

  const ts = meta ? new Date(meta.submittedAt) : new Date();
  const dateStr = ts.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
  const timeStr = ts.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });

  return (
    <>
      {!modalConfirmed && <Modal onConfirm={() => setModalConfirmed(true)} />}

      <div className="header">
        <div className="header-brand">
          <div className="header-mark">HC</div>
          <div>
            <div className="header-name">rag-triage-api</div>
            <div className="header-sub">H&C Incident Triage System</div>
          </div>
        </div>
        <div className="header-meta">
          {meta && <>
            <div className="header-field">
              <div className="header-field-label">Ref</div>
              <div className="header-field-value">{meta.incidentRef}</div>
            </div>
            <div className="header-field">
              <div className="header-field-label">Date</div>
              <div className="header-field-value">{dateStr} {timeStr}</div>
            </div>
            <div className="header-field">
              <div className="header-field-label">Analyst</div>
              <div className="header-field-value">{meta.analyst}</div>
            </div>
            <div className="header-field">
              <div className="header-field-label">Version</div>
              <div className="header-field-value">{meta.pipelineVersion}</div>
            </div>
          </>}
        </div>
        <div className="header-status">
          <div className="status-dot"></div>
          <div className="status-text">
            {view === "results" ? "live · api" : view === "loading" ? "processing" : "ready"}
          </div>
        </div>
      </div>

      <div className="domain-banner">
        <span className="domain-tag">Mandatory</span>
        <span className="domain-text">DOMAIN CONSTRAINT: This system was trained exclusively on OSHA Health and Social Care sector data from care home settings. It has not been validated outside this domain. All outputs are decision-support tools only — not compliance determinations.</span>
      </div>

      {view === "input"   && <InputForm onSubmit={handleSubmit} />}
      {view === "loading" && <LoadingView />}
      {view === "error"   && (
        <div style={{ maxWidth: 760, margin: "48px auto", padding: "0 24px" }}>
          <div className="alert alert-danger">
            <div className="alert-icon">!</div>
            <div>
              <div className="alert-title">Pipeline error</div>
              <div className="alert-body">{apiError}</div>
            </div>
          </div>
          <button onClick={handleReset} style={{ marginTop: 16, background: "var(--blue)", color: "white", border: "none", borderRadius: "var(--r)", padding: "10px 20px", fontFamily: "var(--font-disp)", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
            Try again
          </button>
        </div>
      )}
      {view === "results" && apiData && <ResultsView data={apiData} narrative={narrative} onReset={handleReset} />}

      <footer className="footer">
        <span>rag-triage-api v0.1.0 · stuSterfc/ohs-severity-classifier · DistilBERT</span>
        <span>Demo only · No data stored · Not a compliance determination</span>
      </footer>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
