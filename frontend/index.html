<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>H&C Triage — Single Page (Phase 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   H&C Triage — Design System
   ============================================================ */

:root {
  /* Surface */
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-2: #fbfbf8;
  --surface-sunken: #f1f1ec;

  /* Ink */
  --ink: #14161a;
  --ink-2: #2a2e36;
  --ink-3: #4a4f58;
  --ink-4: #767c86;
  --ink-5: #a8adb5;

  /* Hairlines */
  --line: #e3e3dc;
  --line-strong: #c9c9bf;

  /* Accent */
  --accent: #2d3a8c;
  --accent-2: #4253b8;
  --accent-tint: #eceffb;

  /* Severity ramp C0..C4 (calibrated, similar chroma) */
  --sev-0: #4f8a5b;   /* C0 None — moss */
  --sev-1: #8fa648;   /* C1 Minor — olive */
  --sev-2: #c89636;   /* C2 Moderate — ochre */
  --sev-3: #b8633a;   /* C3 Severe — burnt sienna */
  --sev-4: #962f33;   /* C4 Major — oxblood */

  --sev-0-tint: #e6efe8;
  --sev-1-tint: #eeefd9;
  --sev-2-tint: #f6ebd4;
  --sev-3-tint: #f1dccf;
  --sev-4-tint: #ecd2d3;

  /* RIDDOR */
  --reportable: var(--sev-4);
  --conditional: var(--sev-2);
  --not-required: var(--sev-0);

  /* Type */
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

  /* Radius */
  --r-1: 3px;
  --r-2: 6px;
  --r-3: 10px;

  /* Layout */
  --rail-w: 240px;
  --content-max: 880px;
  --meta-w: 240px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "cv11", "tnum";
}

button { font-family: inherit; cursor: pointer; }
textarea { font-family: inherit; }

/* ---------- App shell ---------- */

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- Header ---------- */

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 30;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-mark {
  width: 28px;
  height: 28px;
  border-radius: var(--r-1);
  background: var(--accent);
  position: relative;
  display: grid;
  place-items: center;
  color: white;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.header-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.header-sub {
  font-size: 12px;
  color: var(--ink-4);
  font-family: var(--font-mono);
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 12px;
  color: var(--ink-3);
  font-family: var(--font-mono);
}

.header-meta .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--sev-1);
  display: inline-block;
  margin-right: 6px;
}

/* ---------- Domain banner ---------- */

.domain-banner {
  background: red;
  color: rgb(0, 0, 0);
  padding: 10px 32px;
  font-size: 12px;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 16px;
  letter-spacing: 0.02em;
}

.domain-banner-tag {
  background: rgba(255,255,255,0.16);
  padding: 2px 8px;
  border-radius: var(--r-1);
  font-weight: 500;
}

.domain-banner-text {
  opacity: 0.92;
}

/* ---------- Layout ---------- */

.main {
  flex: 1;
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--meta-w);
  gap: 0;
  align-items: start;
}

.rail {
  position: sticky;
  top: 92px;
  padding: 32px 24px 32px 32px;
  align-self: start;
}

.content {
  padding: 40px 24px 80px;
  max-width: var(--content-max);
  margin: 0 auto;
  width: 100%;
}

.meta-gutter {
  position: sticky;
  top: 92px;
  padding: 32px 32px 32px 24px;
  align-self: start;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}

/* ---------- Section progress rail ---------- */

.rail-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-4);
  font-family: var(--font-mono);
  margin-bottom: 14px;
}

.rail-list {
  list-style: none;
  margin: 0;
  padding: 0;
  position: relative;
}

.rail-list::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: var(--line);
}

.rail-item {
  position: relative;
  padding: 6px 0 6px 24px;
  cursor: pointer;
  font-size: 12px;
  color: var(--ink-4);
  transition: color 0.15s ease;
  font-family: var(--font-mono);
  display: flex;
  align-items: baseline;
  gap: 10px;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
}

.rail-item:hover {
  color: var(--ink-2);
}

.rail-item-code {
  font-weight: 500;
  flex-shrink: 0;
  width: 28px;
}

.rail-item-label {
  font-family: var(--font-sans);
  font-size: 13px;
  color: inherit;
}

.rail-item::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 12px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  transition: all 0.15s ease;
}

.rail-item.active {
  color: var(--ink);
}

.rail-item.active::before {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-tint);
}

.rail-item.passed::before {
  background: var(--ink-3);
  border-color: var(--ink-3);
}

/* ---------- Section ---------- */

.section {
  margin-bottom: 56px;
  scroll-margin-top: 92px;
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 6px;
}

.section-code {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.06em;
  background: var(--accent-tint);
  padding: 2px 7px;
  border-radius: var(--r-1);
}

.section-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--ink);
}

.section-desc {
  font-size: 13px;
  color: var(--ink-3);
  margin: 0 0 24px;
  max-width: 64ch;
}

/* ---------- Card ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 20px;
  margin-bottom: 12px;
}

.card-flush { padding: 0; }

.card-title {
  font-size: 13px;
  font-weight: 600;
  margin: 0 0 14px;
  letter-spacing: -0.005em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.card-title-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
  font-weight: 400;
}

/* ---------- Badge ---------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.02em;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
}

.badge-accent {
  background: var(--accent-tint);
  border-color: var(--accent-tint);
  color: var(--accent);
}

.badge-sev-0 { background: var(--sev-0-tint); border-color: var(--sev-0-tint); color: var(--sev-0); }
.badge-sev-1 { background: var(--sev-1-tint); border-color: var(--sev-1-tint); color: var(--sev-1); }
.badge-sev-2 { background: var(--sev-2-tint); border-color: var(--sev-2-tint); color: var(--sev-2); }
.badge-sev-3 { background: var(--sev-3-tint); border-color: var(--sev-3-tint); color: var(--sev-3); }
.badge-sev-4 { background: var(--sev-4-tint); border-color: var(--sev-4-tint); color: var(--sev-4); }

.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}

/* ---------- KV grid ---------- */

.kv-grid {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 0;
  border-top: 1px solid var(--line);
}

.kv-grid > * {
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}

.kv-grid dt {
  color: var(--ink-4);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 400;
}

.kv-grid dd {
  margin: 0;
  color: var(--ink);
}

/* ---------- Probability bar ---------- */

.prob-row {
  display: grid;
  grid-template-columns: 110px 1fr 60px;
  gap: 14px;
  align-items: center;
  padding: 7px 0;
  font-size: 13px;
}

.prob-row + .prob-row { border-top: 1px solid var(--line); }

.prob-row-label {
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 8px;
}

.prob-row-label .index {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  width: 14px;
}

.prob-bar {
  height: 8px;
  background: var(--surface-sunken);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}

.prob-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.6s cubic-bezier(0.2, 0, 0, 1);
}

.prob-row-value {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-3);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.prob-row.predicted .prob-row-label {
  font-weight: 600;
  color: var(--ink);
}

.prob-row.predicted .prob-row-value {
  color: var(--ink);
  font-weight: 600;
}

/* ---------- Severity row (the predicted summary) ---------- */

.sev-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 18px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  margin-bottom: 16px;
}

.sev-row-class {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.sev-row-meta {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sev-row-name {
  font-size: 14px;
  font-weight: 600;
}

.sev-row-conf {
  font-size: 12px;
  color: var(--ink-4);
  font-family: var(--font-mono);
}

.sev-row-tag {
  padding: 4px 10px;
  border-radius: var(--r-1);
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ---------- Indicator tags ---------- */

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--surface-sunken);
  border-radius: var(--r-1);
  font-size: 12px;
  color: var(--ink-2);
  border: 1px solid transparent;
}

.tag-strong {
  background: var(--accent-tint);
  color: var(--accent);
}

.tag-weight {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  margin-left: 2px;
}

.tag-strong .tag-weight { color: var(--accent-2); }

/* ---------- Trace table ---------- */

.trace {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.trace th, .trace td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

.trace th {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  font-weight: 500;
  border-bottom: 1px solid var(--line-strong);
}

.trace td.mono {
  font-family: var(--font-mono);
  color: var(--ink-3);
}

.trace .quote {
  color: var(--ink-2);
  font-style: italic;
}

/* ---------- RIDDOR ---------- */

.riddor-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-radius: var(--r-2);
  border: 1px solid;
  margin-bottom: 16px;
}

.riddor-banner.conditional {
  background: var(--sev-2-tint);
  border-color: var(--sev-2);
  color: var(--ink);
}

.riddor-banner.reportable {
  background: var(--sev-4-tint);
  border-color: var(--sev-4);
}

.riddor-banner.not-required {
  background: var(--sev-0-tint);
  border-color: var(--sev-0);
}

.riddor-banner-status {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.riddor-banner-rule {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
}

/* RIDDOR category card — list (not grid) for richer per-category content */
.riddor-cat-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.riddor-cat {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
}

.riddor-cat-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.005em;
  margin: 0;
}

.riddor-cat-desc {
  font-size: 13px;
  color: var(--ink-2);
  margin: 0;
  line-height: 1.55;
}

.riddor-cat-needed {
  background: var(--surface-2);
  border-radius: var(--r-1);
  padding: 10px 14px;
}

.riddor-cat-needed-title {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  margin-bottom: 6px;
}

.riddor-cat-needed-list {
  margin: 0;
  padding-left: 16px;
  font-size: 12.5px;
  color: var(--ink-2);
}

.riddor-cat-needed-list li { padding: 2px 0; }

.riddor-cat-deadline {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--sev-2-tint);
  border-left: 2px solid var(--sev-2);
  border-radius: var(--r-1);
  font-size: 12.5px;
  color: var(--ink);
}

.riddor-cat-deadline-label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--sev-3);
  flex-shrink: 0;
  padding-top: 1px;
}

/* Alert / advisory blocks for T1 flags */
.alert {
  display: flex;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--r-2);
  border: 1px solid;
  margin-bottom: 12px;
  align-items: flex-start;
}

.alert-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  margin-top: 1px;
}

.alert-warn {
  background: var(--sev-2-tint);
  border-color: var(--sev-2);
}
.alert-warn .alert-icon { background: var(--sev-2); color: white; }

.alert-danger {
  background: var(--sev-4-tint);
  border-color: var(--sev-4);
}
.alert-danger .alert-icon { background: var(--sev-4); color: white; }

.alert-title {
  font-size: 13px;
  font-weight: 600;
  margin: 0 0 2px;
}

.alert-body {
  font-size: 12.5px;
  color: var(--ink-2);
  margin: 0;
  line-height: 1.55;
}

/* Mitigation list update — no priority/owner column */
.mit-item {
  grid-template-columns: 36px 1fr;
}

.mit-actions-list {
  margin: 4px 0 0;
  padding-left: 16px;
  font-size: 13px;
  color: var(--ink-2);
}

.mit-actions-list li { padding: 3px 0; }

.riddor-cat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.riddor-cat-code {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.riddor-cat-name {
  font-size: 13px;
  font-weight: 600;
}

.riddor-cat-criteria {
  font-size: 12px;
  color: var(--ink-3);
}

.riddor-cat-conf {
  font-family: var(--font-mono);
  font-size: 11px;
}

.riddor-followup {
  background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-2);
  padding: 16px 18px;
}

.riddor-followup-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  margin: 0 0 10px;
  font-family: var(--font-mono);
}

.riddor-followup-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.riddor-followup-list li {
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  display: flex;
  gap: 10px;
}

.riddor-followup-list li:last-child { border-bottom: 0; }

.riddor-followup-list .num {
  font-family: var(--font-mono);
  color: var(--ink-4);
  font-size: 11px;
  flex-shrink: 0;
  width: 22px;
}

/* ---------- Mitigation ---------- */

.mitigation {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.mit-item {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  align-items: start;
}

.mit-item:first-child { padding-top: 0; }
.mit-item:last-child { border-bottom: 0; padding-bottom: 0; }

.mit-num {
  font-family: var(--font-mono);
  font-size: 22px;
  color: var(--ink-5);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1;
  padding-top: 2px;
}

.mit-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mit-cause {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.mit-action {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.45;
}

.mit-ref {
  font-size: 11px;
  color: var(--ink-4);
  font-family: var(--font-mono);
}

.mit-meta {
  display: flex;
  flex-direction: column;
  align-items: end;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
}

/* ---------- Incident rows ---------- */

.incident {
  display: grid;
  grid-template-columns: 90px 1fr 80px 90px;
  gap: 14px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  align-items: center;
}

.incident:last-child { border-bottom: 0; }

.incident-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}

.incident-summary { color: var(--ink-2); }

.incident-sim {
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.incident-sev {
  text-align: right;
}

/* ---------- Distribution chart ---------- */

.dist-chart {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 140px;
  padding: 0 0 28px;
  position: relative;
  border-bottom: 1px solid var(--line);
}

.dist-bar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
  min-width: 0;
  height: 100%;
  justify-content: flex-end;
}

.dist-bar-fill {
  width: 100%;
  border-radius: var(--r-1) var(--r-1) 0 0;
  background: var(--accent-tint);
  position: relative;
  transition: height 0.6s cubic-bezier(0.2, 0, 0, 1);
}

.dist-bar.highlight .dist-bar-fill {
  background: var(--accent);
}

.dist-bar-value {
  position: absolute;
  top: -18px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
}

.dist-bar-label {
  position: absolute;
  bottom: -22px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  white-space: nowrap;
}

.chart-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.chart-block-title {
  font-size: 11px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  margin: 0 0 18px;
}

/* ---------- Inputs ---------- */

.input-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  padding: 28px;
}

.input-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  font-family: var(--font-mono);
  margin-bottom: 10px;
}

.input-help {
  font-size: 12px;
  color: var(--ink-4);
  margin-bottom: 10px;
}

.input-textarea {
  width: 100%;
  min-height: 240px;
  padding: 14px 16px;
  font-size: 14px;
  line-height: 1.6;
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  background: var(--surface-2);
  color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.input-textarea:focus {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-tint);
}

.input-checkbox {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  cursor: pointer;
  margin-top: 16px;
  user-select: none;
}

.input-checkbox input {
  margin-top: 2px;
  accent-color: var(--accent);
  width: 14px;
  height: 14px;
}

.input-checkbox-text {
  font-size: 13px;
  color: var(--ink-2);
}

.input-checkbox-text strong {
  font-weight: 600;
  color: var(--ink);
}

.input-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 24px;
  gap: 16px;
}

.input-meta {
  font-size: 11px;
  color: var(--ink-4);
  font-family: var(--font-mono);
}

.btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: var(--r-2);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn:hover { background: var(--surface-sunken); }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  font-weight: 500;
}

.btn-primary:hover { background: var(--accent-2); }

.btn-primary:disabled {
  background: var(--ink-5);
  border-color: var(--ink-5);
  cursor: not-allowed;
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--ink-3);
}

.btn-ghost:hover { color: var(--ink); background: var(--surface-sunken); }

/* ---------- Input summary (collapsed state) ---------- */

.input-summary {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 32px;
}

.input-summary-text {
  flex: 1;
  font-size: 13px;
  color: var(--ink-3);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.5;
}

.input-summary-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
  flex-shrink: 0;
}

/* ---------- Report header (RP) ---------- */

.report-header {
  background: var(--ink);
  color: white;
  border-radius: var(--r-3);
  padding: 28px;
}

.report-header-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px 32px;
  margin-bottom: 24px;
}

.report-field-label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.5);
  margin-bottom: 6px;
}

.report-field-value {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.report-field-value.mono {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 400;
}

.report-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 20px;
}

.btn-onDark {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.12);
  color: white;
}

.btn-onDark:hover {
  background: rgba(255,255,255,0.16);
}

/* ---------- Footer ---------- */

.footer {
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-4);
  font-family: var(--font-mono);
}

/* ---------- Inline progress / loading ---------- */

.run-progress {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  padding: 32px;
  margin-top: 24px;
}

.run-progress-title {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.run-progress-title .spinner {
  width: 14px;
  height: 14px;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.run-step {
  display: grid;
  grid-template-columns: 22px 60px 1fr;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  font-size: 13px;
  border-top: 1px solid var(--line);
}

.run-step-status {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  background: var(--surface);
  position: relative;
}

.run-step.done .run-step-status {
  background: var(--accent);
  border-color: var(--accent);
}

.run-step.done .run-step-status::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 1px;
  width: 4px;
  height: 7px;
  border: solid white;
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg);
}

.run-step.active .run-step-status {
  border-color: var(--accent);
  border-top-color: transparent;
  animation: spin 0.8s linear infinite;
}

.run-step-code {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}

.run-step.active .run-step-code, .run-step.done .run-step-code {
  color: var(--ink-2);
}

.run-step-label {
  color: var(--ink-3);
}

.run-step.active .run-step-label, .run-step.done .run-step-label {
  color: var(--ink);
}

/* ---------- Tweaks panel overrides (sit nicely) ---------- */

@media (max-width: 1180px) {
  .meta-gutter { display: none; }
  .main { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
}

@media (max-width: 860px) {
  .rail { display: none; }
  .main { grid-template-columns: 1fr; }
  .content { padding: 24px 20px 60px; }
  .header { padding: 12px 20px; }
  .domain-banner { padding: 10px 20px; }
}

/* fade-in for results */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.section { animation: fadeUp 0.4s cubic-bezier(0.2, 0, 0, 1) both; }
.section:nth-child(1) { animation-delay: 0.00s; }
.section:nth-child(2) { animation-delay: 0.05s; }
.section:nth-child(3) { animation-delay: 0.10s; }
.section:nth-child(4) { animation-delay: 0.15s; }
.section:nth-child(5) { animation-delay: 0.20s; }
.section:nth-child(6) { animation-delay: 0.25s; }

</style>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

  const m = map[activeId];
  return (
    <div>
      <div style={{ textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Active tool</div>
      <div style={{ color: "var(--ink-2)", fontSize: 12, marginBottom: 14 }}>{m.tool}</div>
      <div style={{ textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 6 }}>Model</div>
      <div style={{ color: "var(--ink-2)", fontSize: 12, marginBottom: 14 }}>{m.model}</div>
      <div style={{ textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 6 }}>Latency</div>
      <div style={{ color: "var(--ink-2)", fontSize: 12, marginBottom: 24 }}>{m.lat}</div>
      <div style={{ paddingTop: 14, borderTop: "1px solid var(--line)", fontSize: 10, lineHeight: 1.6 }}>
        Phase 1 is display-only. Human confirmation gates between tools are deferred to Phase 2.
      </div>
    </div>
  );
}

/* ---------- T1: predict_severity ---------- */
function T1() {
  const t = D.t1_predict_severity;
  const pred = sevById(t.predicted_class);

  return (
    <Section id="t1" code="T1" title="Severity prediction" desc="Five-class probability distribution over the C0–C4 lost-time taxonomy. Predicted class shown in bold; boundary-class cases are flagged for human review.">
      <div className="sev-row" style={{ borderColor: sevColor(t.predicted_class), background: sevTint(t.predicted_class) }}>
        <div className="sev-row-class" style={{ color: sevColor(t.predicted_class) }}>{pred.label}</div>
        <div className="sev-row-meta">
          <div className="sev-row-name">{pred.name} <span style={{ color: "var(--ink-4)", fontWeight: 400 }}>· {pred.band}</span></div>
          <div className="sev-row-conf">predicted · confidence {pct(t.confidence)}</div>
        </div>
        <div className="sev-row-tag" style={{ background: sevColor(t.predicted_class), color: "white" }}>
          predicted
        </div>
      </div>

      {t.needlestick_flag && (
        <div className="alert alert-danger">
          <div className="alert-icon">!</div>
          <div>
            <div className="alert-title">Needlestick / sharps exposure detected</div>
            <p className="alert-body">
              Trigger the immediate sharps-injury protocol: source-patient bloods, exposed-staff baseline bloods, and occupational health referral within 1 hour. Reportable as an incident regardless of severity prediction.
            </p>
          </div>
        </div>
      )}

      {t.middle_severity_flag && (
        <div className="alert alert-warn">
          <div className="alert-icon">⚠</div>
          <div>
            <div className="alert-title">Boundary class — human review recommended</div>
            <p className="alert-body">
              The predicted class falls in the C2–C4 band, where misclassification has reporting consequences (RIDDOR over-7-day vs. specified injury). A senior reviewer should confirm the lost-time band before any external notification.
            </p>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">
          <span>Class probabilities</span>
          <span className="card-title-sub">5-class softmax · C0 → C4</span>
        </div>
        {D.severityClasses.map((c) => {
          const p = t.probabilities[c.label] ?? 0;
          const isPred = c.id === t.predicted_class;
          return (
            <div key={c.label} className={"prob-row" + (isPred ? " predicted" : "")}>
              <div className="prob-row-label">
                <span className="index">{c.label}</span>
                <span>{c.name} <span style={{ color: "var(--ink-4)", fontWeight: 400, fontSize: 12 }}>· {c.band}</span></span>
              </div>
              <div className="prob-bar">
                <div
                  className="prob-bar-fill"
                  style={{
                    width: pct(p),
                    background: isPred ? sevColor(c.id) : sevTint(c.id),
                  }}
                ></div>
              </div>
              <div className="prob-row-value">{(p * 100).toFixed(1)}%</div>
            </div>
          );
        })}
      </div>

      <div className="card">
        <div className="card-title">Rationale</div>
        <p style={{ margin: 0, color: "var(--ink-2)", fontSize: 13, lineHeight: 1.6 }}>{t.rationale}</p>
      </div>
    </Section>
  );
}

/* ---------- T2: map_riddor ---------- */
function T2() {
  const t = D.t2_map_riddor;
  return (
    <Section id="t2" code="T2" title="RIDDOR mapping" desc="Rule-based RIDDOR 2013 mapping. Each candidate category names what's still needed to confirm or rule out, and the corresponding reporting deadline.">
      <div className={`riddor-banner ${t.overall_status}`}>
        <div>
          <div className="riddor-banner-status">{t.headline}</div>
          <div className="riddor-banner-rule">{t.statute}</div>
        </div>
        <span className="badge" style={{
          background: "white",
          borderColor: "rgba(0,0,0,0.08)",
          color: "var(--ink)",
          textTransform: "uppercase",
          letterSpacing: "0.06em",
        }}>{t.overall_status}</span>
      </div>

      <div className="card">
        <div className="card-title">
          <span>Candidate categories</span>
          <span className="card-title-sub">{t.categories.length} under consideration</span>
        </div>

        <div className="riddor-cat-list">
          {t.categories.map((c, i) => (
            <div key={i} className="riddor-cat">
              <h4 className="riddor-cat-name">{c.category}</h4>
              <p className="riddor-cat-desc">{c.description}</p>

              <div className="riddor-cat-needed">
                <div className="riddor-cat-needed-title">Information needed</div>
                <ul className="riddor-cat-needed-list">
                  {c.information_needed.map((info, j) => <li key={j}>{info}</li>)}
                </ul>
              </div>

              <div className="riddor-cat-deadline">
                <span className="riddor-cat-deadline-label">Deadline</span>
                <span>{c.reporting_deadline}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="card-title">
          <span>Follow-up questions</span>
          <span className="card-title-sub">advisory-level</span>
        </div>
        <div className="riddor-followup" style={{ background: "var(--surface-2)", border: "1px dashed var(--line-strong)" }}>
          <ul className="riddor-followup-list">
            {t.follow_up_questions.map((q, i) => (
              <li key={i}>
                <span className="num">Q{String(i + 1).padStart(2, "0")}</span>
                <span>{q}</span>
              </li>
            ))}
          </ul>
        </div>
      </div>
    </Section>
  );
}

/* ---------- T3: analyse_causes ---------- */
function T3() {
  const t = D.t3_analyse_causes;
  return (
    <Section id="t3" code="T3" title="Contributing causes & mitigation directions" desc="Causal factors lifted from the narrative, each linked to an HSG220 (or related statutory) section and a list of mitigation actions.">
      <div className="card">
        <div className="card-title">
          <span>Causal factors → mitigations</span>
          <span className="card-title-sub">{t.factors.length} factors · HSG220-aligned</span>
        </div>
        <div className="mitigation">
          {t.factors.map((f, i) => (
            <div key={i} className="mit-item">
              <div className="mit-num">{String(i + 1).padStart(2, "0")}</div>
              <div className="mit-body">
                <div className="mit-cause">{f.cause_type}</div>
                <div className="mit-action">{f.description}</div>
                <div className="mit-ref">{f.hsg220_section}</div>
                <ul className="mit-actions-list">
                  {f.mitigation_actions.map((a, j) => <li key={j}>{a}</li>)}
                </ul>
              </div>
            </div>
          ))}
        </div>
      </div>
    </Section>
  );
}

/* ---------- T4: find_patterns ---------- */
function DistChart({ dist }) {
  // dist is { "C0": 0.04, ... }
  const entries = D.severityClasses.map((c) => ({
    cls: c,
    value: dist[c.label] ?? 0,
  }));
  const max = Math.max(...entries.map((e) => e.value));
  return (
    <div className="dist-chart">
      {entries.map((e) => (
        <div key={e.cls.label} className={"dist-bar" + (e.value === max ? " highlight" : "")}>
          <div
            className="dist-bar-fill"
            style={{
              height: max > 0 ? `${(e.value / max) * 100}%` : "0%",
              background: e.value === max ? sevColor(e.cls.id) : sevTint(e.cls.id),
            }}
          ></div>
          <div className="dist-bar-value">{Math.round(e.value * 100)}%</div>
          <div className="dist-bar-label">{e.cls.label}</div>
        </div>
      ))}
    </div>
  );
}

function T4() {
  const t = D.t4_find_patterns;
  return (
    <Section id="t4" code="T4" title="Population-level pattern analysis" desc={`Compared against ${t.cohort_size.toLocaleString()} prior incidents. Top neighbours and the cohort severity distribution for the identified injury mechanism are shown.`}>
      <div className="card">
        <div className="card-title">
          <span>Injury mechanism</span>
          <span className="card-title-sub">classifier output</span>
        </div>
        <dl className="kv-grid">
          <dt>Mechanism</dt>
          <dd>{t.injury_mechanism}</dd>
          <dt>Cohort size</dt>
          <dd>{t.cohort_size.toLocaleString()} incidents</dd>
        </dl>
      </div>

      <div className="card">
        <div className="card-title">
          <span>Most similar incidents</span>
          <span className="card-title-sub">k-NN · MiniLM-L6 embedding</span>
        </div>
        {t.similar_incidents.map((s) => {
          const sev = sevById(s.severity_outcome);
          return (
            <div key={s.id} className="incident" style={{ gridTemplateColumns: "100px 1fr 110px" }}>
              <span className="incident-id">{s.id}</span>
              <span className="incident-summary">{s.narrative_excerpt}</span>
              <span className="incident-sev">
                <span className={`badge badge-sev-${sev.id}`}>{sev.label} · {sev.name}</span>
              </span>
            </div>
          );
        })}
      </div>

      <div className="card">
        <div className="card-title">
          <span>Severity distribution for this mechanism</span>
          <span className="card-title-sub">cohort split across C0–C4</span>
        </div>
        <DistChart dist={t.severity_distribution} />
      </div>
    </Section>
  );
}

/* ---------- RP ---------- */
function RP() {
  const m = D.meta;
  const fmt = (iso) => {
    const d = new Date(iso);
    return d.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });
  };
  return (
    <Section id="rp" code="RP" title="Report" desc="Final report metadata and exports. Phase 1 produces a static bundle; Phase 2 will gate on human confirmation between tools.">
      <div className="report-header">
        <div className="report-header-grid">
          <div>
            <div className="report-field-label">Incident reference</div>
            <div className="report-field-value mono">{m.incidentRef}</div>
          </div>
          <div>
            <div className="report-field-label">Submitted</div>
            <div className="report-field-value mono">{fmt(m.submittedAt)}</div>
          </div>
          <div>
            <div className="report-field-label">Analyst</div>
            <div className="report-field-value">{m.analyst}</div>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,0.6)", marginTop: 2 }}>{m.analystRole}</div>
          </div>
          <div>
            <div className="report-field-label">Pipeline</div>
            <div className="report-field-value mono">{m.pipelineVersion}</div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginTop: 2 }}>{m.modelStack}</div>
          </div>
        </div>
        <div className="report-actions">
          <button className="btn btn-onDark">Export PDF</button>
          <button className="btn btn-onDark">Export JSON</button>
          <button className="btn btn-onDark">Send to incident log</button>
          <button className="btn btn-onDark">Print</button>
        </div>
      </div>
    </Section>
  );
}

/* ---------- App root ---------- */
function App({ tweaks, initialState = "input" }) {
  const [state, setState] = useState(initialState);
  const [narrative, setNarrative] = useState(D.narrative);
  const [confirmed, setConfirmed] = useState(true);
  const [running, setRunning] = useState(false);
  const [runStep, setRunStep] = useState(0);

  useEffect(() => {
    const root = document.documentElement;
    if (tweaks) {
      root.style.setProperty("--accent", tweaks.accent);
      root.style.setProperty("--bg", tweaks.bg);
      root.style.fontSize = tweaks.density === "compact" ? "13px" : tweaks.density === "comfortable" ? "15px" : "14px";
    }
  }, [tweaks]);

  const handleRun = () => {
    // Skip the simulated pipeline entirely — go straight to results.
    setState("results");
    window.scrollTo({ top: 0 });
  };

  const handleReset = () => {
    setState("input");
    setRunStep(0);
    window.scrollTo({ top: 0 });
  };

  return (
    <div className="app">
      <Header state={state} />
      <DomainBanner />
      {state === "input" ? (
        <main className="main" style={{ gridTemplateColumns: "1fr" }}>
          <div style={{ maxWidth: 760, margin: "0 auto", width: "100%", padding: "0 24px" }}>
            <InputState
              narrative={narrative}
              setNarrative={setNarrative}
              confirmed={confirmed}
              setConfirmed={setConfirmed}
              onRun={handleRun}
              running={running}
              runStep={runStep}
            />
          </div>
        </main>
      ) : (
        <ResultsState narrative={narrative} onReset={handleReset} />
      )}
      <Footer />
    </div>
  );
}

window.App = App;

/* ---------- bootstrap ---------- */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#2d3a8c",
  "bg": "#f6f6f3",
  "density": "default"
}/*EDITMODE-END*/;

function Root() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <React.Fragment>
      <App tweaks={tweaks} />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme">
          <TweakColor label="Accent" value={tweaks.accent} onChange={(v) => setTweak("accent", v)} />
          <TweakColor label="Background" value={tweaks.bg} onChange={(v) => setTweak("bg", v)} />
        </TweakSection>
        <TweakSection label="Density">
          <TweakRadio
            label="Type scale"
            value={tweaks.density}
            options={[
              { value: "compact", label: "Compact" },
              { value: "default", label: "Default" },
              { value: "comfortable", label: "Comfy" },
            ]}
            onChange={(v) => setTweak("density", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

function mount() {
  const el = document.getElementById("root");
  if (!el) { setTimeout(mount, 50); return; }
  ReactDOM.createRoot(el).render(<Root />);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", mount);
} else {
  mount();
}

</script>
</body>
</html>
